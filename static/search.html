<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search · CAM Tracking</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/layout.js"></script>
</head>
<body data-page="search">
    <main class="page page-narrow">
        <div class="page-header">
            <div>
                <h1>Search</h1>
                <p>Find jobs by S-number or title, or tools by any entry format.</p>
            </div>
        </div>

        <div class="card">
            <form id="searchForm" autocomplete="off">
                <div class="input-hero-wrap">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="searchInput" class="input input-hero" style="font-family:var(--font)"
                           placeholder="S1793, panel, 1793-2…" spellcheck="false" autofocus aria-label="Search">
                </div>
            </form>
        </div>

        <div id="results" class="stack-v" style="margin-top:1rem"></div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script>
    (function () {
        'use strict';
        var U = UI;
        var input = document.getElementById('searchInput');
        var results = document.getElementById('results');
        var seq = 0;

        function intro() {
            results.innerHTML = '<div class="card">' + U.emptyState('search', 'Start typing to search',
                'Try an S-number (1793), a title word, or a tool like 1793-1-2.') + '</div>';
        }

        async function run() {
            var q = input.value.trim();
            var url = q ? '?q=' + encodeURIComponent(q) : location.pathname;
            history.replaceState(null, '', url);
            if (!q) { intro(); return; }
            var mine = ++seq;
            results.innerHTML = '<div class="card"><div class="skeleton" style="height:2.5rem;margin-bottom:0.75rem"></div><div class="skeleton" style="height:2.5rem"></div></div>';
            try {
                var data = await API.search(q);
                if (mine !== seq) return;
                render(data);
            } catch (err) {
                if (mine === seq) results.innerHTML = U.inlineAlert(err.message, 'error');
            }
        }

        function render(data) {
            if (!data.jobs.length && !data.cam_items.length) {
                results.innerHTML = '<div class="card">' + U.emptyState('search', 'No matches for “' + data.query + '”',
                    'Check the number, or search by part of the job title.') + '</div>';
                return;
            }
            var html = '';
            if (data.jobs.length) {
                html += '<div class="card"><div class="card-header"><div class="card-title">' + U.icon('briefcase') +
                    'Jobs <span class="badge">' + data.jobs.length + '</span></div></div>' +
                    '<div class="table-wrap"><table class="table"><thead><tr><th>Job</th><th>Priority</th><th>Created</th><th></th></tr></thead><tbody>' +
                    data.jobs.map(function (j) {
                        return '<tr class="is-clickable" data-href="/static/job-detail.html?id=' + j.id + '"><td>' + U.toolId(j.s_number) +
                            (j.title ? '<div class="muted" style="font-size:0.88rem">' + U.esc(j.title) + '</div>' : '') + '</td>' +
                            '<td>' + U.priorityBadge(j.priority_level) + '</td><td class="nowrap">' + U.formatDate(j.created_at) + '</td>' +
                            '<td class="text-right muted">' + U.icon('chevronRight') + '</td></tr>';
                    }).join('') + '</tbody></table></div></div>';
            }
            if (data.cam_items.length) {
                html += '<div class="card"><div class="card-header"><div class="card-title">' + U.icon('tool') +
                    'Tools <span class="badge">' + data.cam_items.length + '</span></div></div>' +
                    '<div class="table-wrap"><table class="table"><thead><tr><th>Tool</th><th>Station</th><th>Last move</th><th class="text-right">Actions</th></tr></thead><tbody>' +
                    data.cam_items.map(function (c) {
                        var entry = c.s_number + '-' + c.set_no + '-' + c.cam_no;
                        return '<tr><td>' + U.toolId(c.s_number, c.set_no, c.cam_no) + '</td><td>' + U.stationBadge(c.status_station) + '</td>' +
                            '<td class="nowrap" title="' + U.esc(U.formatDateTime(c.status_updated_at)) + '">' + U.timeAgo(c.status_updated_at) + '</td>' +
                            '<td class="text-right nowrap"><a class="btn btn-sm btn-primary" href="/static/index.html?q=' + encodeURIComponent(entry) + '">Move</a> ' +
                            '<a class="btn btn-sm" href="/static/job-detail.html?id=' + c.job_id + '">Job</a></td></tr>';
                    }).join('') + '</tbody></table></div></div>';
            }
            results.innerHTML = html;
            results.querySelectorAll('tr[data-href]').forEach(function (tr) {
                tr.addEventListener('click', function () { location.href = tr.dataset.href; });
            });
        }

        input.addEventListener('input', U.debounce(run, 250));
        document.getElementById('searchForm').addEventListener('submit', function (e) { e.preventDefault(); run(); });

        Auth.onReady(function () {
            var q = new URLSearchParams(location.search).get('q');
            if (q) input.value = q;
            run();
            input.focus();
        });
    })();
    </script>
</body>
</html>
