<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry · CAM Tracking</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/layout.js"></script>
</head>
<body data-page="entry">
    <main class="page">
        <div class="entry-layout">
            <section class="stack-v">
                <div class="card">
                    <form id="lookupForm" autocomplete="off">
                        <label class="field-label" for="entryInput" style="display:block;margin-bottom:0.5rem">Scan or type a tool</label>
                        <div class="lookup-row">
                            <div class="input-hero-wrap">
                                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
                                <input type="text" id="entryInput" class="input input-hero" placeholder="1793-1-2"
                                       autocapitalize="characters" spellcheck="false" autofocus>
                            </div>
                            <button type="submit" id="lookupBtn" class="btn btn-primary btn-xl">Look up</button>
                        </div>
                        <div class="hint-row">
                            <span><code>S1793 SET1 CAM2</code></span>
                            <span><code>1793-1-2</code></span>
                            <span><code>S1793-C2-SET1</code></span>
                            <span>or just <code>1793</code> for the whole job</span>
                        </div>
                    </form>
                </div>

                <!-- Shop status while idle -->
                <div id="idlePanel" class="stack-v">
                    <div class="grid grid-4" id="stationTiles"></div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">Needs attention</div>
                            <a href="/static/hot-list.html" class="btn btn-sm btn-ghost">Full hot list</a>
                        </div>
                        <div id="attentionList" class="attention-list"></div>
                    </div>
                </div>

                <!-- Pick a set or cam -->
                <div id="pickerCard" class="card hidden">
                    <div class="card-header">
                        <div>
                            <div class="card-title" id="pickerTitle"></div>
                            <div class="card-subtitle">Tap a cam to move it, or a set to move every cam in it.</div>
                        </div>
                        <button type="button" class="btn btn-ghost btn-icon" data-action="reset" aria-label="Close"></button>
                    </div>
                    <div id="pickerList" class="set-list"></div>
                </div>

                <!-- Move a tool or set -->
                <div id="moveCard" class="card tool-card hidden" tabindex="-1">
                    <div class="tool-header">
                        <div>
                            <div class="tool-title" id="toolTitle"></div>
                            <div class="tool-meta" id="toolMeta"></div>
                        </div>
                        <div id="toolStation"></div>
                    </div>
                    <div id="lifeInfo"></div>

                    <div class="row-between" style="margin:1.25rem 0 0.85rem">
                        <div class="segmented" role="group" aria-label="What to move">
                            <button type="button" data-scope="cam" aria-pressed="true">This cam</button>
                            <button type="button" data-scope="set" aria-pressed="false" id="setScopeBtn">Entire set</button>
                        </div>
                        <span class="muted" id="scopeHint"></span>
                    </div>

                    <div class="station-grid" id="stationGrid"></div>

                    <div class="row-between" style="margin-top:1rem">
                        <button type="button" id="undoBtn" class="btn btn-lg"></button>
                        <button type="button" class="btn btn-lg btn-ghost" data-action="reset">Cancel <kbd style="background:var(--surface-3)">Esc</kbd></button>
                    </div>

                    <div id="historyBlock" class="hidden">
                        <h3 class="section-title">Recent moves for this tool</h3>
                        <div id="historyList" class="timeline"></div>
                    </div>
                </div>
            </section>

            <aside class="card">
                <div class="card-header" style="margin-bottom:0.25rem">
                    <div class="card-title">Recent activity</div>
                    <span class="live-dot">Live</span>
                </div>
                <div id="activityList" class="activity">
                    <div class="skeleton" style="height:3rem;margin:0.5rem 0"></div>
                    <div class="skeleton" style="height:3rem;margin:0.5rem 0"></div>
                    <div class="skeleton" style="height:3rem;margin:0.5rem 0"></div>
                </div>
            </aside>
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script>
    (function () {
        'use strict';
        var U = UI;

        var state = { cam: null, job: null, scope: 'cam', setCams: [] };

        var form = document.getElementById('lookupForm');
        var entryInput = document.getElementById('entryInput');
        var lookupBtn = document.getElementById('lookupBtn');
        var pickerCard = document.getElementById('pickerCard');
        var moveCard = document.getElementById('moveCard');
        var undoBtn = document.getElementById('undoBtn');
        var idlePanel = document.getElementById('idlePanel');

        undoBtn.innerHTML = U.icon('undo') + 'Undo last move';
        document.querySelectorAll('[data-action="reset"]').forEach(function (btn) {
            if (!btn.textContent.trim()) btn.innerHTML = U.icon('x');
            btn.addEventListener('click', resetUI);
        });

        document.getElementById('stationGrid').innerHTML = U.STATIONS.map(function (s) {
            var meta = U.STATION_META[s];
            return '<button type="button" class="station-btn" data-station="' + s + '">' +
                '<span class="station-top">' + U.icon(meta.icon) + '<span class="current-tag hidden">Current</span></span>' +
                '<span><span class="station-name">' + meta.label + '</span><br><span class="station-hint">' + meta.hint + '</span></span>' +
                '</button>';
        }).join('');

        // ========== Lookup ==========

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            lookup(entryInput.value.trim());
        });

        async function lookup(entry) {
            if (!entry) {
                U.toast('Scan or type a tool first', { type: 'warning' });
                entryInput.focus();
                return;
            }
            U.setLoading(lookupBtn, true);
            try {
                var result = await API.resolveEntry(entry);
                if (result.status === 'exact') {
                    await showMove(result.cam_item, result.job);
                } else if (result.status === 'multiple') {
                    showPicker(result.candidates, result.job);
                } else if (result.status === 'job_not_found') {
                    U.toast('No job S' + result.s_number, { type: 'error', detail: 'Check the number or ask an admin to create the job.' });
                    entryInput.select();
                } else {
                    U.toast(result.message || 'Tool not found', { type: 'error' });
                    entryInput.select();
                }
            } catch (err) {
                U.toast(err.message, { type: 'error' });
            } finally {
                U.setLoading(lookupBtn, false);
            }
        }

        // ========== Picker ==========

        var pickerCams = {};

        function showPicker(cams, job) {
            state.job = job;
            pickerCams = {};
            var sets = {};
            cams.forEach(function (cam) {
                pickerCams[cam.id] = cam;
                (sets[cam.set_no] = sets[cam.set_no] || []).push(cam);
            });

            document.getElementById('pickerTitle').innerHTML = U.toolId(job.s_number) +
                (job.title ? ' <span class="muted" style="font-weight:500">' + U.esc(job.title) + '</span>' : '');

            document.getElementById('pickerList').innerHTML = Object.keys(sets).map(Number).sort(function (a, b) { return a - b; }).map(function (setNo) {
                var setCams = sets[setNo].sort(function (a, b) { return a.cam_no - b.cam_no; });
                var counts = {};
                setCams.forEach(function (c) { counts[c.status_station] = (counts[c.status_station] || 0) + 1; });
                return '<div class="set-row">' +
                    '<button type="button" class="set-btn" data-set-cam="' + setCams[0].id + '">' +
                    '<strong>Set ' + U.esc(setNo) + '</strong><small>' + U.icon('layers') + 'Move all ' + setCams.length + '</small>' +
                    U.stackbar(counts) + '</button>' +
                    '<div class="cam-grid">' + setCams.map(function (cam) {
                        return '<button type="button" class="cam-btn" data-cam="' + cam.id + '">' +
                            '<strong>Cam ' + U.esc(cam.cam_no) + '</strong>' + U.stationBadge(cam.status_station) + '</button>';
                    }).join('') + '</div></div>';
            }).join('');

            document.querySelectorAll('#pickerList [data-cam]').forEach(function (btn) {
                btn.addEventListener('click', function () { showMove(pickerCams[btn.dataset.cam], state.job, 'cam'); });
            });
            document.querySelectorAll('#pickerList [data-set-cam]').forEach(function (btn) {
                btn.addEventListener('click', function () { showMove(pickerCams[btn.dataset.setCam], state.job, 'set'); });
            });

            moveCard.classList.add('hidden');
            idlePanel.classList.add('hidden');
            pickerCard.classList.remove('hidden');
        }

        // ========== Move screen ==========

        async function showMove(cam, job, scope) {
            state.cam = cam;
            state.job = job;
            pickerCard.classList.add('hidden');
            idlePanel.classList.add('hidden');
            moveCard.classList.remove('hidden');
            moveCard.dataset.station = cam.status_station;

            document.getElementById('toolTitle').innerHTML = U.toolId(job.s_number, cam.set_no, cam.cam_no);
            var meta = [];
            if (job.title) meta.push('<span>' + U.esc(job.title) + '</span>');
            if (cam.die_position) meta.push('<span class="chip">' + U.esc(U.capitalize(cam.die_position)) + ' die</span>');
            if (cam.enter_die_steel) meta.push('<span class="chip">' + U.esc(U.capitalize(cam.enter_die_steel)) + '</span>');
            meta.push('<span>Updated ' + U.timeAgo(cam.status_updated_at) + '</span>');
            document.getElementById('toolMeta').innerHTML = meta.join('');
            document.getElementById('toolStation').innerHTML = U.stationBadge(cam.status_station, true);
            document.getElementById('lifeInfo').innerHTML = '';
            document.getElementById('historyBlock').classList.add('hidden');

            // Set members are needed for the scope toggle and set moves
            state.setCams = [];
            try {
                var data = await API.job(job.id);
                if (state.cam !== cam) return;
                state.setCams = data.cam_items.filter(function (c) { return c.set_no === cam.set_no; });
            } catch (e) { /* set scope unavailable */ }
            document.getElementById('setScopeBtn').textContent = 'Entire set (' + (state.setCams.length || '?') + ')';
            setScope(scope || 'cam');
            moveCard.focus({ preventScroll: true });
            moveCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            loadLife(cam);
            loadHistory(cam);
        }

        function setScope(scope) {
            state.scope = scope === 'set' && state.setCams.length > 1 ? 'set' : 'cam';
            document.querySelectorAll('[data-scope]').forEach(function (b) {
                b.setAttribute('aria-pressed', String(b.dataset.scope === state.scope));
            });
            document.getElementById('setScopeBtn').disabled = state.setCams.length <= 1;

            var counts = {};
            state.setCams.forEach(function (c) { counts[c.status_station] = (counts[c.status_station] || 0) + 1; });
            document.querySelectorAll('.station-btn').forEach(function (btn) {
                var s = btn.dataset.station;
                var isCurrent = state.scope === 'cam'
                    ? s === state.cam.status_station
                    : counts[s] === state.setCams.length;
                btn.classList.toggle('is-current', isCurrent);
                btn.disabled = isCurrent;
                btn.querySelector('.current-tag').classList.toggle('hidden', !isCurrent);
            });
            document.getElementById('scopeHint').innerHTML = state.scope === 'set'
                ? U.esc(U.STATIONS.filter(function (s) { return counts[s]; }).map(function (s) { return counts[s] + ' ' + U.stationLabel(s); }).join(' · '))
                : '';
        }

        document.querySelectorAll('[data-scope]').forEach(function (b) {
            b.addEventListener('click', function () { setScope(b.dataset.scope); });
        });

        async function loadLife(cam) {
            try {
                var ls = await API.camLifespan(cam.id);
                if (state.cam !== cam) return;
                var cur = ls.current_lifespan;
                var est = ls.forecast.estimated_sharpenings_remaining;
                var pct = cur.percent_life_used;
                var html = '<div class="life-line"><span class="muted" style="font-weight:600">Material life</span>' + U.meter(pct) +
                    '<span></span><span class="muted">' + U.inches(cur.material_remaining) + ' remaining' +
                    (est !== null ? ' · about ' + est + ' sharpening' + (est === 1 ? '' : 's') + ' left' : '') +
                    (cur.lifespan_number ? ' · lifespan #' + cur.lifespan_number : '') + '</span></div>';
                if (pct >= 90) html = U.inlineAlert('Near end of life: ' + U.inches(cur.material_remaining) + ' remaining. Plan a refill.', 'error') + html;
                else if (pct >= 70) html = U.inlineAlert(pct.toFixed(0) + '% of material life used.', 'warning') + html;
                document.getElementById('lifeInfo').innerHTML = '<div style="margin-top:1rem">' + html + '</div>';
            } catch (e) { /* lifespan is informational */ }
        }

        async function loadHistory(cam) {
            try {
                var data = await API.camItem(cam.id);
                if (state.cam !== cam) return;
                var moves = data.moves.filter(function (m) { return !m.undone; }).slice(0, 5);
                if (!moves.length) return;
                document.getElementById('historyList').innerHTML = moves.map(function (m) {
                    return '<div class="timeline-item"><div>' + U.stationBadge(m.from_station) + '<span class="arrow">→</span>' +
                        U.stationBadge(m.to_station) +
                        (m.material_removed !== null ? ' <span class="muted">' + U.inches(m.material_removed) + ' removed</span>' : '') +
                        '</div><div class="muted nowrap" title="' + U.esc(U.formatDateTime(m.moved_at)) + '">' +
                        U.esc(m.operator || '') + ' · ' + U.timeAgo(m.moved_at) + '</div></div>';
                }).join('');
                document.getElementById('historyBlock').classList.remove('hidden');
            } catch (e) { /* history is informational */ }
        }

        // ========== Moving ==========

        document.querySelectorAll('.station-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (btn.disabled) return;
                var station = btn.dataset.station;
                (state.scope === 'set' ? moveSet(station, btn) : moveOne(station, btn));
            });
        });

        function busy(on) {
            document.querySelectorAll('.station-btn').forEach(function (b) { b.style.pointerEvents = on ? 'none' : ''; });
        }

        async function moveOne(station, btn) {
            var cam = state.cam, job = state.job;
            var label = U.toolIdText(job.s_number, cam.set_no, cam.cam_no);
            var material = null;
            if (cam.status_station === 'sharpen' && station === 'cabinet') {
                material = await U.materialDialog(label);
                if (material === null) return;
            }
            busy(true);
            btn.style.opacity = '0.6';
            try {
                var result = await API.moveCam({ cam_item_id: cam.id, to_station: station, material_removed: material });
                U.toast(label + ' → ' + U.stationLabel(station), {
                    type: 'success',
                    detail: result.auto_bumped
                        ? 'Auto-bumped Set ' + result.auto_bumped.set_no + ' Cam ' + result.auto_bumped.cam_no + ' to Sharpen'
                        : null,
                    action: { label: 'Undo', onClick: function () { undoMany([cam.id].concat(result.auto_bumped ? [result.auto_bumped.cam_item_id] : []), label); } }
                });
                resetUI();
            } catch (err) {
                U.toast(err.message, { type: 'error' });
            } finally {
                busy(false);
                btn.style.opacity = '';
            }
        }

        async function moveSet(station, btn) {
            var job = state.job, setNo = state.cam.set_no;
            var material = {};
            // Collect every reading first: cancelling leaves the whole set untouched
            if (station === 'cabinet') {
                var sharpened = state.setCams.filter(function (c) { return c.status_station === 'sharpen'; })
                    .sort(function (a, b) { return a.cam_no - b.cam_no; });
                for (var i = 0; i < sharpened.length; i++) {
                    var c = sharpened[i];
                    var value = await U.materialDialog(U.toolIdText(job.s_number, c.set_no, c.cam_no) +
                        (sharpened.length > 1 ? ' (' + (i + 1) + ' of ' + sharpened.length + ')' : ''));
                    if (value === null) return;
                    material[c.id] = value;
                }
            }
            busy(true);
            btn.style.opacity = '0.6';
            try {
                var result = await API.moveSet({ job_id: job.id, set_no: setNo, to_station: station, material_removed: material });
                var label = U.toolIdText(job.s_number, setNo);
                var ids = result.moved.concat(result.bumped).map(function (m) { return m.cam_item_id; });
                U.toast(label + ': ' + result.moved.length + ' cam' + (result.moved.length === 1 ? '' : 's') + ' → ' + U.stationLabel(station), {
                    type: 'success',
                    detail: result.bumped_sets.length ? 'Bumped Set ' + result.bumped_sets.join(', ') + ' to Sharpen' : null,
                    action: { label: 'Undo', onClick: function () { undoMany(ids, label); } }
                });
                resetUI();
            } catch (err) {
                U.toast(err.message, { type: 'error' });
            } finally {
                busy(false);
                btn.style.opacity = '';
            }
        }

        async function undoMany(camIds, label) {
            var failed = 0;
            for (var i = 0; i < camIds.length; i++) {
                try { await API.undoMove(camIds[i]); } catch (e) { failed++; }
            }
            if (failed) U.toast('Undo failed for ' + failed + ' tool(s)', { type: 'error' });
            else U.toast('Undid move: ' + label, { type: 'info' });
            loadActivity();
        }

        undoBtn.addEventListener('click', async function () {
            var cam = state.cam;
            var label = U.toolIdText(state.job.s_number, cam.set_no, cam.cam_no);
            var ok = await U.confirmDialog('Undo last move?', 'Reverts the most recent move recorded for ' + label + '.', { confirmLabel: 'Undo move' });
            if (!ok) return;
            U.setLoading(undoBtn, true);
            try {
                var result = await API.undoMove(cam.id);
                U.toast(label + ' reverted to ' + U.stationLabel(result.reverted_to_station), { type: 'success' });
                resetUI();
            } catch (err) {
                U.toast(err.message, { type: 'error' });
            } finally {
                U.setLoading(undoBtn, false);
            }
        });

        function resetUI() {
            state.cam = null;
            state.setCams = [];
            pickerCard.classList.add('hidden');
            moveCard.classList.add('hidden');
            entryInput.value = '';
            entryInput.focus();
            idlePanel.classList.remove('hidden');
            loadActivity();
            loadIdle();
        }

        // ========== Idle status ==========

        async function loadIdle() {
            try {
                var results = await Promise.all([API.analytics('station-counts'), API.hotList()]);
                var counts = {};
                results[0].forEach(function (r) { counts[r.station] = r.count; });
                document.getElementById('stationTiles').innerHTML = U.STATIONS.map(function (s) {
                    return '<div class="stat" data-station="' + s + '"><div class="stat-label">' + U.stationLabel(s) +
                        '</div><div class="stat-value">' + U.number(counts[s] || 0) + '</div></div>';
                }).join('');
                var hot = results[1].slice(0, 3);
                var list = document.getElementById('attentionList');
                if (!hot.length) {
                    list.innerHTML = U.emptyState('checkCircle', 'Nothing waiting on sharpening');
                    return;
                }
                list.innerHTML = hot.map(function (j) {
                    var flags = (j.has_blocked_position ? '<span class="flag">' + U.icon('alert') + 'Blocked</span>' : '') +
                        (j.all_in_sharpen ? '<span class="flag flag-warning">All in sharpen</span>' : '');
                    return '<button type="button" class="attention-item" data-s="' + U.esc(j.s_number) + '">' +
                        '<div><div class="row">' + U.toolId(j.s_number) + U.priorityBadge(j.priority_level) + flags + '</div>' +
                        '<div class="muted" style="font-size:0.88rem">' + (j.title ? U.esc(j.title) + ' · ' : '') + j.sharpen_count + ' in sharpen · ' +
                        j.available_sets + ' set' + (j.available_sets === 1 ? '' : 's') + ' available</div></div>' +
                        U.stackbar({ active: j.active_count, sharpen: j.sharpen_count, cabinet: j.cabinet_count, refill: j.refill_count }) +
                        '</button>';
                }).join('');
                list.querySelectorAll('[data-s]').forEach(function (b) {
                    b.addEventListener('click', function () { entryInput.value = b.dataset.s; lookup(b.dataset.s); });
                });
            } catch (err) {
                document.getElementById('attentionList').innerHTML = U.inlineAlert(err.message, 'error');
            }
        }

        // ========== Recent activity ==========

        var activityMoves = {};

        async function loadActivity() {
            var list = document.getElementById('activityList');
            try {
                var moves = await API.moves({ limit: 12 });
                activityMoves = {};
                if (!moves.length) {
                    list.innerHTML = U.emptyState('clock', 'No moves yet', 'Moves recorded on any kiosk show up here.');
                    return;
                }
                list.innerHTML = moves.map(function (m) {
                    activityMoves[m.id] = m;
                    return '<div class="activity-item' + (m.undone ? ' is-undone' : '') + '">' +
                        U.stationBadge(m.to_station) +
                        '<div class="what"><a href="#" data-move="' + m.id + '">' + U.toolId(m.s_number, m.set_no, m.cam_no) + '</a>' +
                        '<div class="muted">' + (m.undone ? 'Undone · ' : m.from_station === 'new' ? 'Created · ' : 'from ' + U.esc(U.stationLabel(m.from_station)) + ' · ') + U.esc(m.operator || '') + '</div></div>' +
                        '<span class="when" title="' + U.esc(U.formatDateTime(m.moved_at)) + '">' + U.timeAgo(m.moved_at) + '</span></div>';
                }).join('');
                list.querySelectorAll('[data-move]').forEach(function (a) {
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        var m = activityMoves[a.dataset.move];
                        entryInput.value = m.s_number + '-' + m.set_no + '-' + m.cam_no;
                        lookup(entryInput.value);
                    });
                });
            } catch (err) {
                list.innerHTML = U.inlineAlert(err.message, 'error');
            }
        }

        // ========== Keyboard ==========

        document.addEventListener('keydown', function (e) {
            if (document.querySelector('dialog[open]') || document.querySelector('.login-overlay:not(.hidden)')) return;
            if (e.key === 'Escape' && (state.cam || !pickerCard.classList.contains('hidden'))) {
                resetUI();
                return;
            }
            // Scan anytime: printable keys typed outside a field start a new lookup
            var t = e.target;
            var inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
            if (!inField && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && e.key !== ' ') {
                if (state.cam || !pickerCard.classList.contains('hidden')) {
                    pickerCard.classList.add('hidden');
                    moveCard.classList.add('hidden');
                    idlePanel.classList.remove('hidden');
                    state.cam = null;
                }
                entryInput.value = '';
                entryInput.focus();
            }
        });

        Auth.onReady(function () {
            loadActivity();
            loadIdle();
            var q = new URLSearchParams(location.search).get('q');
            if (q) {
                history.replaceState(null, '', location.pathname);
                entryInput.value = q;
                lookup(q);
            } else {
                entryInput.focus();
            }
        });
        setInterval(function () { if (document.visibilityState === 'visible' && Session.isLoggedIn()) {
            loadActivity();
            if (!idlePanel.classList.contains('hidden')) loadIdle();
        } }, 30000);
    })();
    </script>
</body>
</html>
