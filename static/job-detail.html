<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job · CAM Tracking</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/layout.js"></script>
</head>
<body data-page="job">
    <main class="page">
        <a href="#" class="back-link" id="backLink"></a>
        <div class="page-header">
            <div>
                <h1 id="jobTitle"><span class="skeleton" style="display:inline-block;width:12rem;height:1.8rem"></span></h1>
                <p id="jobSubtitle"></p>
            </div>
            <div class="page-actions" id="jobActions"></div>
        </div>

        <div id="jobBody">
            <div class="grid grid-4" id="stationTiles" style="margin-bottom:1rem"></div>
            <div class="card hidden" id="notesCard"></div>
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Tools</div>
                        <div class="card-subtitle">Sharpening history and material life for the current lifespan.</div>
                    </div>
                    <div class="legend" id="lifeLegend"></div>
                </div>
                <div id="toolsTable"><div class="spinner"></div></div>
            </div>
        </div>
    </main>

    <script src="/static/js/auth.js"></script>
    <script>
    (function () {
        'use strict';
        var U = UI;
        var jobId = new URLSearchParams(location.search).get('id');
        var back = document.getElementById('backLink');
        back.innerHTML = U.icon('arrowLeft') + 'Back';
        back.addEventListener('click', function (e) {
            e.preventDefault();
            if (history.length > 1 && document.referrer.indexOf(location.host) >= 0) history.back();
            else location.href = '/static/hot-list.html';
        });
        document.getElementById('lifeLegend').innerHTML =
            '<span><i style="background:var(--success)"></i>Under 70%</span><span><i style="background:var(--warning)"></i>70–89%</span><span><i style="background:var(--danger)"></i>90%+ used</span>';

        function fail(message) {
            document.getElementById('jobTitle').textContent = 'Job not available';
            document.getElementById('jobBody').innerHTML = '<div class="card">' + U.emptyState('alert', message) + '</div>';
        }

        async function load() {
            if (!jobId) { fail('No job selected'); return; }
            try {
                var results = await Promise.all([API.job(jobId), API.jobToolStats(jobId)]);
                render(results[0], results[1]);
            } catch (err) {
                fail(err.message);
            }
        }

        function render(data, stats) {
            var job = data.job, cams = data.cam_items;
            document.title = 'S' + job.s_number + ' · CAM Tracking';
            document.getElementById('jobTitle').innerHTML = 'S' + U.esc(job.s_number) + ' ' + U.priorityBadge(job.priority_level);
            document.getElementById('jobSubtitle').textContent = (job.title || 'Untitled job') + ' · created ' + U.formatDate(job.created_at);
            document.getElementById('jobActions').innerHTML =
                '<a class="btn btn-primary btn-lg" href="/static/index.html?q=' + encodeURIComponent(job.s_number) + '">' + U.icon('scan') + 'Move tools</a>';

            var counts = {};
            cams.forEach(function (c) { counts[c.status_station] = (counts[c.status_station] || 0) + 1; });
            document.getElementById('stationTiles').innerHTML = U.STATIONS.map(function (s) {
                var n = counts[s] || 0;
                return '<div class="stat" data-station="' + s + '"><div class="stat-label">' + U.stationLabel(s) + '</div>' +
                    '<div class="stat-value">' + n + '</div><div class="stat-sub">' +
                    (cams.length ? Math.round(n / cams.length * 100) + '% of ' + cams.length + ' tools' : 'No tools') + '</div></div>';
            }).join('');

            var notesCard = document.getElementById('notesCard');
            if (job.notes) {
                notesCard.innerHTML = '<div class="card-title" style="margin-bottom:0.4rem">Notes</div><p style="white-space:pre-wrap">' + U.esc(job.notes) + '</p>';
                notesCard.classList.remove('hidden');
            }

            var container = document.getElementById('toolsTable');
            if (!cams.length) {
                container.innerHTML = U.emptyState('tool', 'No tools yet', 'An admin can add sets and cams from Admin → Tools.');
                return;
            }

            var statsById = {};
            stats.forEach(function (s) { statsById[s.cam_item_id] = s; });
            var html = '<div class="table-wrap"><table class="table"><thead><tr>' +
                '<th>Set</th><th>Cam</th><th>Station</th><th class="num">Sharpenings</th><th class="num">Last removed</th>' +
                '<th class="num">Avg removed</th><th class="num">This life</th><th class="num">Remaining</th><th>Life used</th><th>Notes</th>' +
                '</tr></thead><tbody>';
            var prevSet = null;
            cams.forEach(function (cam) {
                var s = statsById[cam.id] || {};
                var newSet = cam.set_no !== prevSet;
                prevSet = cam.set_no;
                var low = s.material_remaining !== undefined && s.material_remaining < 0.05;
                html += '<tr class="' + (newSet ? 'set-start' : '') + '">' +
                    '<td class="nowrap">' + (newSet ? '<strong>Set ' + cam.set_no + '</strong>' : '') + '</td>' +
                    '<td class="nowrap"><a href="/static/index.html?q=' + encodeURIComponent(job.s_number + '-' + cam.set_no + '-' + cam.cam_no) + '" title="Move this tool">Cam ' + cam.cam_no + '</a>' +
                    (cam.die_position ? ' <span class="muted" style="font-size:0.82rem">' + U.esc(U.capitalize(cam.die_position)) + '</span>' : '') + '</td>' +
                    '<td>' + U.stationBadge(cam.status_station) + '</td>' +
                    '<td class="num">' + (s.sharpen_count || 0) + '</td>' +
                    '<td class="num">' + U.inches(s.last_material_removed) + '</td>' +
                    '<td class="num">' + U.inches(s.avg_material_removed) + '</td>' +
                    '<td class="num">' + (s.lifespan_material_removed ? U.inches(s.lifespan_material_removed) : '—') + '</td>' +
                    '<td class="num"' + (low ? ' style="color:var(--danger);font-weight:700"' : '') + '>' + U.inches(s.material_remaining) + '</td>' +
                    '<td>' + U.meter(s.percent_life_used || 0) + '</td>' +
                    '<td class="muted">' + (cam.notes ? U.esc(cam.notes) : '—') + '</td></tr>';
            });
            container.innerHTML = html + '</tbody></table></div>';
        }

        Auth.onReady(load);
    })();
    </script>
</body>
</html>
