[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Asyncio configuration
asyncio_mode = auto

# Test paths
testpaths = tests

# Markers
markers =
    asyncio: marks tests as async (handled automatically by pytest-asyncio)
    slow: marks tests as slow running
    integration: marks tests as integration tests
